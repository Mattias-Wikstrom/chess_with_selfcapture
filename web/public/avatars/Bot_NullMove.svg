<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" rx="12" fill="#0D1B2A"/>
  <!-- Circuit board pattern -->
  <line x1="10" y1="20" x2="30" y2="20" stroke="#1DE9B6" stroke-width="0.5" opacity="0.4"/>
  <line x1="30" y1="20" x2="30" y2="10" stroke="#1DE9B6" stroke-width="0.5" opacity="0.4"/>
  <line x1="50" y1="20" x2="70" y2="20" stroke="#1DE9B6" stroke-width="0.5" opacity="0.4"/>
  <line x1="50" y1="20" x2="50" y2="10" stroke="#1DE9B6" stroke-width="0.5" opacity="0.4"/>
  <!-- Robot head -->
  <rect x="16" y="18" width="48" height="44" rx="8" fill="#1C2B3A"/>
  <rect x="18" y="20" width="44" height="40" rx="6" fill="#243447"/>
  <!-- Screen eyes - HUD style -->
  <rect x="22" y="30" width="16" height="12" rx="2" fill="#00BCD4" opacity="0.2"/>
  <rect x="42" y="30" width="16" height="12" rx="2" fill="#00BCD4" opacity="0.2"/>
  <rect x="22" y="30" width="16" height="12" rx="2" fill="none" stroke="#1DE9B6" stroke-width="1"/>
  <rect x="42" y="30" width="16" height="12" rx="2" fill="none" stroke="#1DE9B6" stroke-width="1"/>
  <text x="25" y="38" font-size="7" fill="#1DE9B6" font-family="monospace">+0.4</text>
  <text x="44" y="38" font-size="7" fill="#1DE9B6" font-family="monospace">depth</text>
  <!-- Speaker mouth -->
  <rect x="26" y="48" width="28" height="4" rx="2" fill="#1DE9B6" opacity="0.3"/>
  <line x1="30" y1="50" x2="50" y2="50" stroke="#1DE9B6" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- Antenna -->
  <line x1="40" y1="18" x2="40" y2="10" stroke="#1DE9B6" stroke-width="1.5"/>
  <circle cx="40" cy="9" r="2" fill="#1DE9B6"/>
</svg>