<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" rx="12" fill="#ECEFF1"/>
  <!-- Castle-like head with battlements -->
  <rect x="14" y="12" width="52" height="8" rx="1" fill="#546E7A"/>
  <rect x="14" y="10" width="8" height="10" rx="1" fill="#546E7A"/>
  <rect x="36" y="10" width="8" height="10" rx="1" fill="#546E7A"/>
  <rect x="58" y="10" width="8" height="10" rx="1" fill="#546E7A"/>
  <!-- Face - slightly square -->
  <rect x="18" y="20" width="44" height="42" rx="8" fill="#FFCC80"/>
  <!-- Stoic eyes - square, serious -->
  <rect x="27" y="35" width="10" height="8" rx="2" fill="white"/>
  <rect x="43" y="35" width="10" height="8" rx="2" fill="white"/>
  <rect x="29" y="36" width="6" height="6" rx="1" fill="#263238"/>
  <rect x="45" y="36" width="6" height="6" rx="1" fill="#263238"/>
  <!-- Firm straight mouth -->
  <rect x="30" y="50" width="20" height="3" rx="1.5" fill="#8D6E63"/>
  <!-- Stone texture lines -->
  <line x1="18" y1="30" x2="62" y2="30" stroke="#BDBDBD" stroke-width="0.5" opacity="0.5"/>
  <line x1="18" y1="48" x2="62" y2="48" stroke="#BDBDBD" stroke-width="0.5" opacity="0.5"/>
</svg>