  <ellipse cx="47" cy="41" rx="4.5" ry="3" fill="white"/>
  <ellipse cx="33" cy="41" rx="3" ry="2" fill="#8B0000"/>
  <ellipse cx="47" cy="41" rx="3" ry="2" fill="#8B0000"/>
