<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" rx="12" fill="#212121"/>
  <!-- Dark vignette circles -->
  <circle cx="40" cy="40" r="38" fill="#1A1A2E" opacity="0.8"/>
  <!-- Face - pale, ominous -->
  <circle cx="40" cy="42" r="21" fill="#E0D7C8"/>
  <!-- Hollow eyes -->
  <circle cx="33" cy="40" r="4.5" fill="#1A1A2E"/>
  <circle cx="47" cy="40" r="4.5" fill="#1A1A2E"/>
  <circle cx="33" cy="40" r="1.5" fill="#6A1B9A" opacity="0.8"/>
  <circle cx="47" cy="40" r="1.5" fill="#6A1B9A" opacity="0.8"/>
  <!-- Thin knowing smile -->
  <path d="M34 51 Q40 54 46 51" stroke="#424242" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Tightening ring around face -->
  <circle cx="40" cy="42" r="24" fill="none" stroke="#6A1B9A" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
  <circle cx="40" cy="42" r="27" fill="none" stroke="#4A148C" stroke-width="1" stroke-dasharray="3 4" opacity="0.4"/>
  <!-- Dark hood/hair -->
  <path d="M19 32 Q22 14 40 16 Q58 14 61 32 Q55 20 40 20 Q25 20 19 32 Z" fill="#121212"/>
</svg>