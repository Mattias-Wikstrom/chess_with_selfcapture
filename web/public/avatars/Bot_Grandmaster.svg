<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" rx="12" fill="#3E2723"/>
  <!-- Old wooden background -->
  <rect x="2" y="2" width="76" height="76" rx="10" fill="#4E342E" opacity="0.6"/>
  <!-- Face - authoritative, older -->
  <circle cx="40" cy="43" r="21" fill="#FFCC80"/>
  <!-- Distinguished grey hair -->
  <path d="M19 36 Q22 16 40 18 Q58 16 61 36 Q54 20 40 20 Q26 20 19 36 Z" fill="#9E9E9E"/>
  <!-- Temples grey -->
  <ellipse cx="22" cy="38" rx="5" ry="8" fill="#BDBDBD" opacity="0.7"/>
  <ellipse cx="58" cy="38" rx="5" ry="8" fill="#BDBDBD" opacity="0.7"/>
  <!-- Wise eyes with slight bags -->
  <ellipse cx="33" cy="42" rx="4.5" ry="3.5" fill="white"/>
  <ellipse cx="47" cy="42" rx="4.5" ry="3.5" fill="white"/>
  <circle cx="33" cy="42" r="2.5" fill="#1A237E"/>
  <circle cx="47" cy="42" r="2.5" fill="#1A237E"/>
  <!-- Slight lines under eyes -->
  <path d="M29 46 Q33 48 37 46" stroke="#D7A66E" stroke-width="0.8" fill="none"/>
  <path d="M43 46 Q47 48 51 46" stroke="#D7A66E" stroke-width="0.8" fill="none"/>
  <!-- Distinguished smile -->
  <path d="M34 52 Q40 57 46 52" stroke="#A0522D" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Chess book -->
  <rect x="54" y="56" width="18" height="14" rx="2" fill="#8D6E63"/>
  <rect x="55" y="57" width="16" height="12" rx="1" fill="#D7CCC8"/>
  <text x="57" y="65" font-size="5" fill="#3E2723">♟ 1958</text>
</svg>