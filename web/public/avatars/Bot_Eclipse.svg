<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" rx="12" fill="#0A0A0A"/>
  <!-- Eclipse background - corona effect -->
  <circle cx="40" cy="40" r="36" fill="#1A0030" opacity="0.8"/>
  <circle cx="40" cy="40" r="32" fill="#2D0050" opacity="0.6"/>
  <!-- Eclipse corona rays -->
  <circle cx="40" cy="40" r="26" fill="none" stroke="#4A0080" stroke-width="4" opacity="0.3"/>
  <!-- The dark face - eclipse itself -->
  <circle cx="40" cy="40" r="22" fill="#0A0A0A"/>
  <!-- Barely visible features in darkness -->
  <circle cx="33" cy="38" r="4" fill="#1A0030"/>
  <circle cx="47" cy="38" r="4" fill="#1A0030"/>
  <!-- Eyes glow purple -->
  <circle cx="33" cy="38" r="2.5" fill="#7B1FA2" opacity="0.9"/>
  <circle cx="47" cy="38" r="2.5" fill="#7B1FA2" opacity="0.9"/>
  <circle cx="33" cy="37" r="0.8" fill="#CE93D8"/>
  <circle cx="47" cy="37" r="0.8" fill="#CE93D8"/>
  <!-- Dark smile, barely visible -->
  <path d="M34 49 Q40 54 46 49" stroke="#4A0080" stroke-width="1.5" fill="none"/>
  <!-- Light squares dying motif -->
  <rect x="8" y="8" width="6" height="6" rx="1" fill="#FFD700" opacity="0.2"/>
  <rect x="8" y="8" width="6" height="6" rx="1" fill="#1A0030" opacity="0.6"/>
</svg>