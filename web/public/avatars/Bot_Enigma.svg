<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" rx="12" fill="#1A1A2E"/>
  <!-- Mystery swirl background -->
  <circle cx="40" cy="40" r="30" fill="#16213E" opacity="0.8"/>
  <circle cx="40" cy="40" r="22" fill="#0F3460" opacity="0.6"/>
  <!-- Face - half lit -->
  <circle cx="40" cy="40" r="20" fill="#E8D5B7"/>
  <!-- Shadow over half face -->
  <path d="M40 20 A20 20 0 0 0 40 60 Z" fill="#1A1A2E" opacity="0.6"/>
  <!-- Mysterious eye (one visible) -->
  <circle cx="33" cy="40" r="4" fill="white"/>
  <circle cx="33" cy="40" r="2.5" fill="#0F3460"/>
  <circle cx="34" cy="39" r="0.8" fill="white"/>
  <!-- Hidden eye silhouette -->
  <circle cx="47" cy="40" r="4" fill="#0F3460" opacity="0.4"/>
  <!-- Knowing slight smile -->
  <path d="M36 49 Q40 52 44 49" stroke="#8B7355" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- ? marks floating -->
  <text x="60" y="24" font-size="10" fill="#E94560" opacity="0.7" font-family="serif">?</text>
  <text x="10" y="56" font-size="8" fill="#E94560" opacity="0.4" font-family="serif">?</text>
</svg>