<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" rx="12" fill="#ECEFF1"/>
  <!-- Chrome-like head -->
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="50%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>
  </defs>
  <circle cx="40" cy="40" r="28" fill="url(#chrome)"/>
  <circle cx="40" cy="40" r="24" fill="#ECEFF1"/>
  <!-- Cold, narrowed eyes -->
  <rect x="26" y="36" width="12" height="5" rx="2.5" fill="#B0BEC5"/>
  <rect x="42" y="36" width="12" height="5" rx="2.5" fill="#B0BEC5"/>
  <rect x="27" y="36" width="10" height="5" rx="2.5" fill="#455A64"/>
  <rect x="43" y="36" width="10" height="5" rx="2.5" fill="#455A64"/>
  <!-- Contemptuous flat mouth -->
  <line x1="32" y1="50" x2="48" y2="50" stroke="#607D8B" stroke-width="2" stroke-linecap="round"/>
  <!-- Slight condescending tilt implied by eyebrows -->
  <path d="M26 33 L38 31" stroke="#546E7A" stroke-width="2" stroke-linecap="round"/>
  <path d="M42 31 L54 33" stroke="#546E7A" stroke-width="2" stroke-linecap="round"/>
  <!-- Chip/circuit mark on forehead -->
  <rect x="35" y="20" width="10" height="8" rx="1" fill="#CFD8DC" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="37" y1="20" x2="37" y2="28" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="40" y1="20" x2="40" y2="28" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="43" y1="20" x2="43" y2="28" stroke="#90A4AE" stroke-width="0.5"/>
</svg>